# Incognitor — Fly.io configuration
#
# Processes:
#   web -> Django via gunicorn (public traffic, TLS automatic; scans + the
#          recurring-scan scheduler run in-process here)
#
# One-time setup (see deploy/fly.md):
#   fly launch --no-deploy --name <your-app>          # creates the app + this toml
#   fly volumes create incognitor_data --size 1       # persistent SQLite volume
#   fly secrets set DJANGO_SECRET_KEY=... EMAIL_HOST_USER=... EMAIL_HOST_PASSWORD=...
#   fly deploy

app = "incognitor"
primary_region = "lax"

# Migrations + broker seeding run in entrypoint.sh before gunicorn starts, on the
# same machine and volume, so no separate release command is needed.
[env]
  DEBUG = "false"
  DJANGO_SETTINGS_MODULE = "incognitor.settings"
  ALLOWED_HOSTS = "localhost,127.0.0.1,.fly.dev"
  CSRF_TRUSTED_ORIGINS = "https://incognitor.fly.dev"
  DB_PATH = "/app/data/db.sqlite3"
  STATIC_ROOT = "/app/staticfiles"
  PLAYWRIGHT_BROWSERS_PATH = "/ms-playwright"

  # Scans run in-process on the web machine (see gunicorn.conf.py), so no
  # Celery worker, beat process, or Redis broker is required.
  # CELERY_BROKER_URL = ""

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[mounts]
  source = "incognitor_data"
  destination = "/app/data"

[processes]
  app = "./entrypoint.sh"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"