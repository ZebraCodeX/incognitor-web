{% extends "core/base.html" %}
{% block title %}Login - Incognitor{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12 bg-slate-900 border border-slate-800 rounded-2xl p-8">
    <h1 class="text-2xl font-bold text-white mb-6 text-center">Welcome Back</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">{{ field.label }}</label>
                <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}" value="{{ field.value|default_if_none:'' }}" placeholder="{{ field.label }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                {% if field.errors %}
                    <p class="text-red-400 text-xs mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition">Login</button>
    </form>
    <p class="text-sm text-slate-400 text-center mt-4">
        Don't have an account? <a href="{% url 'signup' %}" class="text-indigo-400 hover:text-indigo-300">Sign up</a>
    </p>
</div>
{% endblock %}
